[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanflow"
version = "0.1.0"
description = "Anomaly detection pipeline for industrial scan images"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
scanflow = "scanflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
